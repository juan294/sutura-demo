name: Sutura repair monitor
run-name: "${{ format('{0}: {1} #{2} ({3}) on {4}', github.event.workflow_run.conclusion == 'success' && 'No repair needed' || (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && 'Repair requested' || 'Repair not triggered', github.event.workflow_run.name, github.event.workflow_run.run_number, github.event.workflow_run.conclusion, github.event.workflow_run.head_branch) }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed CI workflow run ID to retry
        required: true
        type: string

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: sutura-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    name: Attempt verified CI repair
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        ((github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
          !startsWith(github.event.workflow_run.head_branch, 'matrix/') &&
          !startsWith(github.event.workflow_run.head_branch, 'case-lab/'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify and repair failed CI
        uses: juan294/sutura/packages/action@c94eee2086b31450d975137a0102dda18522d0b8   # newest release tag; Phase 4 moves it to v0.3.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          capture-replay: true
          runtime: auto
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          contree-token: ${{ secrets.CONTREE_TOKEN }}
          contree-project: ${{ vars.CONTREE_PROJECT }}
