name: Break me

on:
  workflow_dispatch:
    inputs:
      failure:
        description: Placebo case to inject
        required: true
        type: choice
        options:
          - assertion
          - flaky
          - upstream
          - greenwash-bait

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  create-broken-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Apply the selected Placebo break
        id: break
        env:
          FAILURE: ${{ inputs.failure }}
        run: |
          metadata="$(node scripts/materialize-break.mjs "$FAILURE")"
          echo "case-id=$(jq -r .caseId <<<"$metadata")" >> "$GITHUB_OUTPUT"
      - name: Open the broken pull request and dispatch Sutura after red CI
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE: ${{ inputs.failure }}
          CASE_ID: ${{ steps.break.outputs.case-id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="break/${FAILURE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src test
          git commit -m "test(demo): inject ${CASE_ID}"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "demo: ${FAILURE} failure (${CASE_ID})" \
            --body "Injected from Sutura Placebo case \`${CASE_ID}\`. CI is dispatched explicitly so Sutura can repair this exact SHA.")"
          ci_url="$(gh workflow run ci.yml --ref "$branch")"
          ci_run_id="${ci_url##*/}"
          if gh run watch "$ci_run_id" --exit-status; then
            echo "Expected the injected ${CASE_ID} case to fail CI" >&2
            exit 1
          fi
          ci_conclusion="$(gh run view "$ci_run_id" --json conclusion --jq .conclusion)"
          test "$ci_conclusion" = failure
          sutura_url="$(gh workflow run sutura.yml --ref "$BASE_BRANCH" -f run_id="$ci_run_id")"
          {
            echo "### Broken pull request created"
            echo
            echo "- Case: \`${CASE_ID}\`"
            echo "- Pull request: ${pr_url}"
            echo "- Failed CI: ${ci_url}"
            echo "- Sutura: ${sutura_url}"
          } >> "$GITHUB_STEP_SUMMARY"
